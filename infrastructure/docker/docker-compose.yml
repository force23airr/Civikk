services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: civik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: civik
    ports:
      - "5432:5432"
    volumes:
      - civik-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civik"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  civik-postgres-data:
